<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Reset Password — VocaMate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-primary: #070b14;
      --bg-secondary: #0e1526;
      --bg-card: #151f34;
      --bg-input: #090e1a;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --blue: #38bdf8;
      --blue-dark: #0284c7;
      --green: #10b981;
      --red: #ef4444;
      --border-color: rgba(255, 255, 255, 0.08);
      --radius-lg: 20px;
      --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
      background: radial-gradient(circle at 50% 10%, #15213b 0%, #070b14 100%);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .card {
      background: var(--bg-card);
      max-width: 400px;
      width: 100%;
      padding: 32px 28px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
    h2 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 4px;
      background: linear-gradient(135deg, var(--blue), var(--blue-dark));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      color: var(--text-secondary);
      font-size: 14px;
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-top: 14px;
      margin-bottom: 6px;
      color: var(--text-secondary);
      font-size: 13px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      background: var(--bg-input);
      color: var(--text-primary);
      font-size: 16px;
      outline: none;
      transition: var(--transition);
    }
    input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(79, 195, 247, 0.15);
    }
    /* Password Input Wrap & Show/Hide Eye Toggle */
    .password-input-wrap {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
    }
    .password-input-wrap input {
      width: 100%;
      padding-right: 48px !important;
    }
    .password-toggle-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
      font-size: 16px;
      line-height: 1;
      z-index: 5;
      width: 36px;
      height: 36px;
    }
    .password-toggle-btn:hover {
      color: var(--green);
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(-50%) scale(1.08);
    }
    .password-toggle-btn:active {
      transform: translateY(-50%) scale(0.95);
    }
    .password-toggle-btn svg {
      width: 19px;
      height: 19px;
      pointer-events: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .start-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--blue), var(--blue-dark));
      color: var(--bg-primary);
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 24px;
      transition: var(--transition);
    }
    .start-btn:hover {
      transform: scale(1.02);
      opacity: 0.9;
    }
    .msg {
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 14px;
      display: none;
    }
    .msg.error {
      background: rgba(239, 83, 80, 0.12);
      border: 1px solid var(--red);
      color: var(--red);
      display: block;
    }
    .msg.success {
      background: rgba(102, 187, 106, 0.12);
      border: 1px solid var(--green);
      color: var(--green);
      display: block;
    }
    .back-link {
      display: block;
      margin-top: 16px;
      text-align: center;
      color: var(--blue);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Reset Password</h2>
    <p class="subtitle">Enter your new account password</p>
    <div id="msgBox" class="msg"></div>
    <div id="formSection">
      <div id="tokenInputWrapper" style="display:none; margin-bottom:12px;">
        <label>🔑 Reset Code / Token</label>
        <input type="text" id="manualToken" placeholder="Paste your 64-character token" autocomplete="off" />
      </div>
      <label>🔒 New Password</label>
      <div class="password-input-wrap">
        <input type="password" id="newPassword" placeholder="At least 8 characters" autocomplete="new-password" />
        <button type="button" class="password-toggle-btn" data-target="newPassword" title="Show password" aria-label="Toggle password visibility">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>
      </div>
      <label>🔒 Confirm Password</label>
      <div class="password-input-wrap">
        <input type="password" id="confirmPassword" placeholder="Re-enter password" autocomplete="new-password" />
        <button type="button" class="password-toggle-btn" data-target="confirmPassword" title="Show password" aria-label="Toggle password visibility">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>
      </div>
      <button class="start-btn" id="submitBtn">Update Password & Sign In</button>
    </div>
    <a href="/" class="back-link">← Return to Sign In</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    let token = (params.get('token') || '').trim();
    const msgBox = document.getElementById('msgBox');
    const formSection = document.getElementById('formSection');
    const tokenInputWrapper = document.getElementById('tokenInputWrapper');
    const manualToken = document.getElementById('manualToken');
    const submitBtn = document.getElementById('submitBtn');

    const EYE_OPEN = `<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
    const EYE_OFF = `<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;

    // Password visibility toggle handler
    document.querySelectorAll('.password-toggle-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        const targetId = btn.dataset.target;
        const input = document.getElementById(targetId);
        if (!input) return;
        const isPassword = input.type === 'password';
        input.type = isPassword ? 'text' : 'password';
        btn.innerHTML = isPassword ? EYE_OFF : EYE_OPEN;
        btn.setAttribute('title', isPassword ? 'Hide password' : 'Show password');
        btn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
      });
    });

    if (!token) {
      tokenInputWrapper.style.display = 'block';
      msgBox.className = 'msg error';
      msgBox.textContent = 'Paste your reset token below, or request a new reset link from the sign in page.';
    }

    submitBtn.addEventListener('click', async () => {
      if (!token) {
        token = (manualToken.value || '').trim();
      }
      if (!token) {
        msgBox.className = 'msg error';
        msgBox.textContent = 'Please enter or paste your reset token.';
        return;
      }
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      
      if (!newPassword || newPassword.length < 8) {
        msgBox.className = 'msg error';
        msgBox.textContent = 'Password must be at least 8 characters.';
        return;
      }
      if (newPassword !== confirmPassword) {
        msgBox.className = 'msg error';
        msgBox.textContent = 'Passwords do not match.';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Updating password...';
      
      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Password reset failed');
        
        msgBox.className = 'msg success';
        msgBox.textContent = '✅ Password updated successfully! You are signed in. Redirecting...';
        formSection.style.display = 'none';
        setTimeout(() => { window.location.href = '/'; }, 1500);
      } catch (err) {
        msgBox.className = 'msg error';
        msgBox.textContent = err.message;
        submitBtn.disabled = false;
        submitBtn.textContent = 'Update Password & Sign In';
      }
    });
  </script>
</body>
</html>
